<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>VAROSA · Seguimiento de OV Pendientes</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700&family=Inter:wght@600;700;800&display=swap" rel="stylesheet">
<style>
  /* ==========================================================
     VAROSA — OV Pendientes Widget  v3 (refresh + snapshot)
     ========================================================== */
  :root {
    --c-cyan:        #15C9E4;
    --c-blue-mid:    #4672B1;
    --c-yellow:      #FFAD00;
    --c-blue-dark:   #325895;
    --c-bg:          #F4F6FA;
    --c-surface:     #FFFFFF;
    --c-border:      #E2E7EF;
    --c-text:        #1A2332;
    --c-text-soft:   #5C6A82;
    --c-text-muted:  #8A95A8;
    --c-success:     #16A34A;
    --c-success-bg:  #DCFCE7;
    --c-warn:        #EA580C;
    --c-warn-bg:     #FFEDD5;
    --c-info:        #0EA5E9;
    --c-info-bg:     #E0F2FE;
    --c-error:       #DC2626;
    --c-error-bg:    #FEE2E2;

    --radius-sm: 6px;
    --radius:    10px;
    --radius-lg: 14px;
    --shadow-sm: 0 1px 2px rgba(15,23,42,.06);
    --shadow:    0 4px 12px rgba(15,23,42,.06), 0 1px 2px rgba(15,23,42,.04);
    --shadow-lg: 0 12px 32px rgba(15,23,42,.1);

    --font-display: 'Inter', system-ui, sans-serif;
    --font-body:    'Montserrat', system-ui, sans-serif;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; }
  body {
    font-family: var(--font-body);
    background: var(--c-bg);
    color: var(--c-text);
    font-size: 14px;
    line-height: 1.5;
    -webkit-font-smoothing: antialiased;
  }
  button { font-family: inherit; cursor: pointer; border: none; background: none; }
  input, select, textarea { font-family: inherit; font-size: inherit; }

  .app { max-width: 1400px; margin: 0 auto; padding: 24px; }

  .header {
    background: linear-gradient(135deg, var(--c-blue-dark) 0%, var(--c-blue-mid) 100%);
    color: #fff;
    border-radius: var(--radius-lg);
    padding: 24px 28px;
    margin-bottom: 20px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    flex-wrap: wrap;
    gap: 16px;
    box-shadow: var(--shadow);
  }
  .header-title { display: flex; align-items: center; gap: 14px; }
  .header-icon {
    width: 44px; height: 44px;
    background: rgba(255,255,255,.15);
    border-radius: 10px;
    display: flex; align-items: center; justify-content: center;
    font-size: 20px;
  }
  .header h1 {
    font-family: var(--font-display);
    font-size: 20px;
    font-weight: 700;
    letter-spacing: -.01em;
  }
  .header .subtitle { font-size: 12px; opacity: .8; font-weight: 500; margin-top: 2px; }
  .header-actions { display: flex; align-items: center; gap: 12px; }
  .btn-refresh {
    background: rgba(255,255,255,.15);
    color: #fff;
    padding: 9px 16px;
    border-radius: 8px;
    font-size: 13px;
    font-weight: 600;
    transition: background .15s;
    display: inline-flex; align-items: center; gap: 8px;
  }
  .btn-refresh:hover { background: rgba(255,255,255,.25); }
  .btn-refresh.loading { opacity: .6; pointer-events: none; }
  .btn-refresh svg { width: 14px; height: 14px; }
  .btn-refresh.loading svg { animation: spin 1s linear infinite; }
  @keyframes spin { to { transform: rotate(360deg); } }

  .kpis {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
    gap: 12px;
    margin-bottom: 20px;
  }
  .kpi {
    background: var(--c-surface);
    border-radius: var(--radius);
    padding: 16px 18px;
    box-shadow: var(--shadow-sm);
    border-left: 3px solid var(--c-cyan);
  }
  .kpi.warn  { border-left-color: var(--c-warn); }
  .kpi.info  { border-left-color: var(--c-info); }
  .kpi.gold  { border-left-color: var(--c-yellow); }
  .kpi-label { font-size: 11px; font-weight: 600; text-transform: uppercase; letter-spacing: .05em; color: var(--c-text-muted); }
  .kpi-value { font-family: var(--font-display); font-size: 24px; font-weight: 700; color: var(--c-blue-dark); margin-top: 4px; }
  .kpi-sub { font-size: 11px; color: var(--c-text-soft); margin-top: 2px; }

  .filters {
    background: var(--c-surface);
    border-radius: var(--radius);
    padding: 16px;
    margin-bottom: 16px;
    box-shadow: var(--shadow-sm);
    display: grid;
    grid-template-columns: 2fr repeat(3, 1fr) auto;
    gap: 10px;
    align-items: end;
  }
  @media (max-width: 900px) { .filters { grid-template-columns: 1fr 1fr; } }
  .filter-group { display: flex; flex-direction: column; gap: 4px; }
  .filter-group label { font-size: 11px; font-weight: 600; color: var(--c-text-muted); text-transform: uppercase; letter-spacing: .04em; }
  .filter-group input, .filter-group select {
    padding: 9px 12px;
    border: 1px solid var(--c-border);
    border-radius: 8px;
    background: var(--c-bg);
    color: var(--c-text);
    transition: border-color .15s, background .15s;
    width: 100%;
  }
  .filter-group input:focus, .filter-group select:focus { outline: none; border-color: var(--c-cyan); background: #fff; }
  .btn-clear {
    padding: 9px 14px;
    background: var(--c-bg);
    color: var(--c-text-soft);
    border-radius: 8px;
    font-size: 12px;
    font-weight: 600;
    border: 1px solid var(--c-border);
    transition: all .15s;
    height: 38px;
  }
  .btn-clear:hover { background: #fff; color: var(--c-text); }

  .status-bar { background: var(--c-surface); border-radius: var(--radius); padding: 60px 20px; text-align: center; box-shadow: var(--shadow-sm); }
  .status-bar.error { color: var(--c-error); }
  .status-bar p { color: var(--c-text-soft); margin-top: 8px; font-size: 13px; }
  .spinner { width: 32px; height: 32px; border: 3px solid var(--c-border); border-top-color: var(--c-cyan); border-radius: 50%; animation: spin .8s linear infinite; margin: 0 auto; }

  .product-list { display: flex; flex-direction: column; gap: 10px; }
  .product-group { background: var(--c-surface); border-radius: var(--radius); box-shadow: var(--shadow-sm); overflow: hidden; transition: box-shadow .2s; }
  .product-group:hover { box-shadow: var(--shadow); }
  .product-group.expanded { box-shadow: var(--shadow); }
  .product-header {
    display: grid;
    grid-template-columns: 28px 1fr auto auto auto;
    align-items: center;
    gap: 16px;
    padding: 14px 18px;
    cursor: pointer;
    user-select: none;
    transition: background .15s;
  }
  .product-header:hover { background: #FAFBFD; }
  .chevron { width: 22px; height: 22px; display: flex; align-items: center; justify-content: center; color: var(--c-text-muted); transition: transform .2s; }
  .product-group.expanded .chevron { transform: rotate(90deg); color: var(--c-blue-mid); }
  .chevron svg { width: 14px; height: 14px; }
  .product-name { font-weight: 600; color: var(--c-text); font-size: 14px; line-height: 1.35; }
  .product-meta { font-size: 12px; color: var(--c-text-muted); margin-top: 2px; }
  .product-stat { text-align: right; min-width: 80px; }
  .product-stat-value { font-family: var(--font-display); font-weight: 700; color: var(--c-blue-dark); font-size: 16px; line-height: 1.1; }
  .product-stat-label { font-size: 10px; text-transform: uppercase; letter-spacing: .04em; color: var(--c-text-muted); font-weight: 600; margin-top: 2px; }
  .badge-count { background: var(--c-info-bg); color: var(--c-info); padding: 4px 10px; border-radius: 999px; font-size: 11px; font-weight: 700; }

  .ov-list { display: none; border-top: 1px solid var(--c-border); background: #FAFBFD; }
  .product-group.expanded .ov-list { display: block; }
  .ov-row {
    display: grid;
    grid-template-columns: minmax(140px, 1.2fr) minmax(180px, 1.6fr) 100px 90px 70px 60px minmax(180px, 2fr) 130px 110px 80px;
    gap: 12px;
    padding: 12px 18px 12px 62px;
    align-items: start;
    border-bottom: 1px solid var(--c-border);
    font-size: 12px;
  }
  .ov-row:last-child { border-bottom: none; }
  .ov-row:hover { background: #fff; }
  .ov-row.dirty { background: #FFFBEB; }
  .ov-row.dirty:hover { background: #FFF8DB; }
  .ov-row-headers {
    background: #EEF2F8;
    padding: 8px 18px 8px 62px;
    font-size: 10px;
    font-weight: 700;
    color: var(--c-text-muted);
    text-transform: uppercase;
    letter-spacing: .04em;
    border-bottom: 1px solid var(--c-border);
  }
  .cell { display: flex; flex-direction: column; gap: 3px; min-width: 0; }
  .cell-label { font-size: 9px; text-transform: uppercase; letter-spacing: .03em; color: var(--c-text-muted); font-weight: 600; display: none; }
  @media (max-width: 1100px) { .ov-row { grid-template-columns: 1fr 1fr; padding: 12px 18px; } .ov-row-headers { display: none; } .cell-label { display: block; } }
  .cell-strong { font-weight: 600; color: var(--c-text); }
  .cell-soft { color: var(--c-text-soft); }
  .cell-num { font-variant-numeric: tabular-nums; }

  .pill-abc { display: inline-block; padding: 2px 8px; border-radius: 4px; font-size: 10px; font-weight: 700; width: fit-content; }
  .pill-abc.A { background: var(--c-success-bg); color: var(--c-success); }
  .pill-abc.B { background: var(--c-warn-bg); color: var(--c-warn); }
  .pill-abc.C { background: var(--c-info-bg); color: var(--c-info); }
  .pill-abc.D { background: #F1F5F9; color: var(--c-text-muted); }

  .ov-input, .ov-select {
    padding: 6px 8px;
    border: 1px solid var(--c-border);
    border-radius: 6px;
    background: #fff;
    width: 100%;
    font-size: 12px;
    transition: border-color .15s;
  }
  .ov-input:focus, .ov-select:focus { outline: none; border-color: var(--c-cyan); }
  .ov-textarea { min-height: 32px; resize: vertical; font-family: inherit; }

  .estado-select.estado-Pendiente { border-color: var(--c-warn); color: var(--c-warn); font-weight: 600; }
  .estado-select.estado-En.proceso, .estado-select[data-estado="En proceso"] { border-color: var(--c-info); color: var(--c-info); font-weight: 600; }
  .estado-select.estado-Resuelto { border-color: var(--c-success); color: var(--c-success); font-weight: 600; }

  .btn-save {
    background: var(--c-cyan);
    color: #fff;
    padding: 6px 12px;
    border-radius: 6px;
    font-size: 11px;
    font-weight: 700;
    transition: all .15s;
    width: 100%;
    text-transform: uppercase;
    letter-spacing: .03em;
  }
  .btn-save:hover { background: #0FB5CE; transform: translateY(-1px); }
  .btn-save:disabled { background: var(--c-border); color: var(--c-text-muted); cursor: not-allowed; transform: none; }
  .btn-save.saving { background: var(--c-blue-mid); pointer-events: none; }
  .btn-save.saved { background: var(--c-success); pointer-events: none; }

  .toast-container {
    position: fixed;
    bottom: 24px;
    right: 24px;
    display: flex;
    flex-direction: column;
    gap: 10px;
    z-index: 1000;
    pointer-events: none;
  }
  .toast {
    background: var(--c-surface);
    border-radius: 10px;
    padding: 12px 16px;
    box-shadow: var(--shadow-lg);
    display: flex;
    align-items: flex-start;
    gap: 10px;
    font-size: 13px;
    font-weight: 500;
    min-width: 280px;
    max-width: 420px;
    border-left: 4px solid var(--c-cyan);
    animation: slideUp .25s ease-out;
    pointer-events: auto;
  }
  .toast.success { border-left-color: var(--c-success); }
  .toast.error { border-left-color: var(--c-error); }
  .toast.warn { border-left-color: var(--c-warn); }
  .toast.info { border-left-color: var(--c-info); }
  .toast .toast-icon { font-size: 16px; flex-shrink: 0; }
  .toast-body { display: flex; flex-direction: column; gap: 4px; }
  .toast-body strong { font-weight: 700; }
  .toast-body small { font-size: 11px; color: var(--c-text-soft); font-weight: 500; line-height: 1.4; }
  @keyframes slideUp { from { transform: translateY(20px); opacity: 0; } to { transform: translateY(0); opacity: 1; } }

  .empty { text-align: center; padding: 60px 20px; color: var(--c-text-soft); }
  .empty-icon { font-size: 40px; margin-bottom: 12px; opacity: .5; }
  .footer-info { margin-top: 20px; text-align: center; font-size: 11px; color: var(--c-text-muted); }
</style>
</head>
<body>

<div class="app">

  <header class="header">
    <div class="header-title">
      <div class="header-icon">📋</div>
      <div>
        <h1>Seguimiento de OV Pendientes</h1>
        <div class="subtitle">VAROSA · Backoffice / Compras</div>
      </div>
    </div>
    <div class="header-actions">
      <button class="btn-refresh" id="btnRefresh" title="Recargar datos">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
          <path d="M21 12a9 9 0 1 1-3-6.7L21 8"/><path d="M21 3v5h-5"/>
        </svg>
        Actualizar
      </button>
    </div>
  </header>

  <section class="kpis" id="kpis"></section>

  <section class="filters">
    <div class="filter-group">
      <label for="searchInput">Búsqueda libre</label>
      <input type="text" id="searchInput" placeholder="Buscar por OV, cliente, producto, comentario...">
    </div>
    <div class="filter-group">
      <label for="filterRuta">Ruta</label>
      <select id="filterRuta"><option value="">Todas</option></select>
    </div>
    <div class="filter-group">
      <label for="filterVendedor">Vendedor</label>
      <select id="filterVendedor"><option value="">Todos</option></select>
    </div>
    <div class="filter-group">
      <label for="filterEstado">Estado</label>
      <select id="filterEstado">
        <option value="">Todos (excl. Resuelto)</option>
        <option value="Pendiente">Pendiente</option>
        <option value="En proceso">En proceso</option>
      </select>
    </div>
    <button class="btn-clear" id="btnClear">Limpiar</button>
  </section>

  <div id="statusBar" class="status-bar">
    <div class="spinner"></div>
    <p>Cargando pendientes...</p>
  </div>

  <main class="product-list" id="productList" style="display:none;"></main>

  <div class="footer-info" id="footerInfo"></div>
</div>

<div class="toast-container" id="toastContainer"></div>

<script>
/* ============================================================
   VAROSA — OV Pendientes Widget  v3
   Cambios respecto a v2:
   - CONFIG.DEBUG = false (apagado para producción)
   - saveRow() hace refresh silencioso del registro antes de PATCH
   - Detecta conflictos (otro usuario editó) y bloquea el guardado
   - Envía _previo y _nuevo de ETA/Estado/Comentario para que el
     workflow de notificaciones detecte qué cambió
   ============================================================ */
const CONFIG = {
  API_BASE: 'https://n8n.varosacr.com/webhook';
  EP_LISTAR:    '/ov-pendientes-listar',
  EP_ACTUALIZAR:'/ov-pendientes-actualizar',
  DEBUG: false   // apagado en producción
};

const state = {
  raw: [],
  pendientes: [],
  filters: { search:'', ruta:'', vendedor:'', estado:'' },
  expanded: new Set()
};

/* ============================================================
   FETCH DE DATOS (GET listar)
   ============================================================ */
async function loadPendientes() {
  showLoading();
  try {
    const records = await fetchListado();
    state.raw = records;
    state.pendientes = records.filter(r => normEstado(r.Estado) !== 'Resuelto');

    populateFilters();
    render();
    updateFooter();
  } catch (err) {
    console.error('Error cargando pendientes:', err);
    showError('No se pudieron cargar los pendientes. Detalle: ' + err.message);
  }
}

/**
 * Hace el GET al webhook listar y devuelve el array de registros.
 * Usado tanto por loadPendientes() como por el refresh silencioso.
 */
async function fetchListado() {
  const res = await fetch(CONFIG.API_BASE + CONFIG.EP_LISTAR, {
    method: 'GET',
    headers: { 'Accept': 'application/json' }
  });
  if (!res.ok) throw new Error('HTTP ' + res.status);
  const data = await res.json();

  if (CONFIG.DEBUG) {
    console.group('🐛 DEBUG: respuesta GET ov-pendientes-listar');
    console.log('Estructura completa:', data);
    console.groupEnd();
  }

  return normalizeResponse(data);
}

function normalizeResponse(data) {
  if (Array.isArray(data)) return data;
  if (data && Array.isArray(data.data))    return data.data;
  if (data && Array.isArray(data.records)) return data.records;
  if (data && Array.isArray(data.result))  return data.result;
  if (data && Array.isArray(data.pendientes)) return data.pendientes;
  if (data && typeof data === 'object') {
    for (const v of Object.values(data)) {
      if (Array.isArray(v)) return v;
    }
  }
  console.warn('⚠️ Estructura de respuesta no reconocida.');
  return [];
}

function normEstado(e) {
  if (!e) return 'Pendiente';
  const s = String(e).trim();
  if (/resuelto/i.test(s)) return 'Resuelto';
  if (/proceso/i.test(s))  return 'En proceso';
  return 'Pendiente';
}

/* ============================================================
   FILTROS
   ============================================================ */
function populateFilters() {
  const rutas = unique(state.pendientes.map(r => r.Ruta)).sort();
  const vendedores = unique(state.pendientes.map(r => r.Vendedor_Responsable)).sort();
  fillSelect('filterRuta', rutas, 'Todas');
  fillSelect('filterVendedor', vendedores, 'Todos');
}
function unique(arr) { return Array.from(new Set(arr.filter(Boolean).map(x => String(x).trim()))); }
function fillSelect(id, items, defaultLabel) {
  const sel = document.getElementById(id);
  const current = sel.value;
  sel.innerHTML = `<option value="">${defaultLabel}</option>` +
    items.map(v => `<option value="${escapeAttr(v)}">${escapeHtml(v)}</option>`).join('');
  if (items.includes(current)) sel.value = current;
}
function applyFilters(records) {
  const { search, ruta, vendedor, estado } = state.filters;
  const q = search.trim().toLowerCase();
  return records.filter(r => {
    if (ruta && r.Ruta !== ruta) return false;
    if (vendedor && r.Vendedor_Responsable !== vendedor) return false;
    if (estado && normEstado(r.Estado) !== estado) return false;
    if (q) {
      const haystack = [
        r.Numero_OV, r.Cliente, r.Producto, r.Comentario, r.Vendedor_Responsable, r.Ruta
      ].map(x => (x ?? '').toString().toLowerCase()).join(' | ');
      if (!haystack.includes(q)) return false;
    }
    return true;
  });
}

/* ============================================================
   RENDER
   ============================================================ */
function render() {
  hideStatus();
  const list = document.getElementById('productList');
  list.style.display = '';

  const visibles = applyFilters(state.pendientes);
  renderKPIs(visibles);

  if (visibles.length === 0) {
    list.innerHTML = `
      <div class="empty">
        <div class="empty-icon">🔍</div>
        <strong>No hay pendientes que coincidan con los filtros.</strong>
        <p>Probá limpiar los filtros o usar otros criterios.</p>
      </div>`;
    return;
  }

  const groups = groupByProduct(visibles);
  list.innerHTML = groups.map(g => renderGroup(g)).join('');

  list.querySelectorAll('.product-header').forEach(h => {
    h.addEventListener('click', () => toggleGroup(h.dataset.key));
  });
  list.querySelectorAll('.ov-input, .ov-select, .ov-textarea').forEach(el => {
    el.addEventListener('input', onCellChange);
    el.addEventListener('change', onCellChange);
  });
  list.querySelectorAll('.btn-save').forEach(btn => {
    btn.addEventListener('click', () => saveRow(btn.dataset.id));
  });
}

function renderKPIs(visibles) {
  const totalLineas = visibles.length;
  const totalMonto  = visibles.reduce((s,r) => s + (Number(r.Monto_Pendiente)||0), 0);
  const enProceso   = visibles.filter(r => normEstado(r.Estado) === 'En proceso').length;
  const productosUnicos = new Set(visibles.map(r => r.Producto)).size;

  document.getElementById('kpis').innerHTML = `
    <div class="kpi">
      <div class="kpi-label">Líneas pendientes</div>
      <div class="kpi-value">${totalLineas.toLocaleString('es-CR')}</div>
      <div class="kpi-sub">visibles según filtros</div>
    </div>
    <div class="kpi gold">
      <div class="kpi-label">Monto pendiente</div>
      <div class="kpi-value">${formatMoneda(totalMonto)}</div>
      <div class="kpi-sub">CRC, suma filtrada</div>
    </div>
    <div class="kpi info">
      <div class="kpi-label">En proceso</div>
      <div class="kpi-value">${enProceso}</div>
      <div class="kpi-sub">con seguimiento activo</div>
    </div>
    <div class="kpi warn">
      <div class="kpi-label">Productos únicos</div>
      <div class="kpi-value">${productosUnicos}</div>
      <div class="kpi-sub">SKUs diferentes</div>
    </div>
  `;
}

function groupByProduct(records) {
  const map = new Map();
  for (const r of records) {
    const key = r.Producto || '(sin nombre)';
    if (!map.has(key)) map.set(key, { key, producto: key, items: [] });
    map.get(key).items.push(r);
  }
  for (const g of map.values()) {
    g.items.sort((a,b) => parseFecha(a.Fecha_OV) - parseFecha(b.Fecha_OV));
    g.totalCantidad = g.items.reduce((s,r) => s + (Number(r.Cantidad_Pendiente_Snapshot)||0), 0);
    g.totalMonto    = g.items.reduce((s,r) => s + (Number(r.Monto_Pendiente)||0), 0);
  }
  return Array.from(map.values()).sort((a,b) => b.totalMonto - a.totalMonto);
}

function renderGroup(g) {

  return `

}

function renderRow(r) {
  const id = r.ID_Linea_OV;

/* ============================================================
   EDICIÓN / GUARDADO  (con refresh silencioso + snapshot previo)
   ============================================================ */
const dirtyMap = new Map(); // id -> { Comentario?, ETA?, Estado? }

function onCellChange(e) {
  const el = e.target;
  const id = el.dataset.id;
  const field = el.dataset.field;
  if (!id || !field) return;

  const original = state.pendientes.find(r => r.ID_Linea_OV === id);
  if (!original) return;

  const newVal = el.value;
  const oldVal = field === 'ETA' ? formatFechaInput(original.ETA) :
                 field === 'Estado' ? normEstado(original.Estado) :
                 (original[field] ?? '');

  const current = dirtyMap.get(id) || {};
  if (String(newVal) !== String(oldVal)) {
    current[field] = newVal;
  } else {
    delete current[field];
  }

  if (Object.keys(current).length === 0) dirtyMap.delete(id);
  else dirtyMap.set(id, current);

  const row = document.querySelector(`.ov-row[data-id="${cssEscape(id)}"]`);
  if (row) {
    row.classList.toggle('dirty', dirtyMap.has(id));
    const btn = row.querySelector('.btn-save');
    if (btn) btn.disabled = !dirtyMap.has(id);
  }
  if (field === 'Estado') el.dataset.estado = newVal;
}

/**
 * Guardar una fila con el flujo: refresh silencioso → detectar conflicto → PATCH
 */
async function saveRow(id) {
  const changes = dirtyMap.get(id);
  if (!changes) return;
  const row = document.querySelector(`.ov-row[data-id="${cssEscape(id)}"]`);
  const btn = row?.querySelector('.btn-save');
  if (!btn) return;

  btn.classList.add('saving');
  btn.textContent = 'Guardando...';
  btn.disabled = true;

  try {
    // --- Paso 1: refresh silencioso para obtener el snapshot FRESCO del servidor ---
    const registrosFrescos = await fetchListado();
    const snapshotFresco = registrosFrescos.find(r => r.ID_Linea_OV === id);

    if (!snapshotFresco) {
      throw new Error('El registro ya no existe (puede haber sido resuelto por otro usuario)');
    }
    if (!snapshotFresco.creator_ID) {
      throw new Error('Falta creator_ID en el snapshot fresco');
    }

    // --- Paso 2: detectar conflicto ---
    // Comparar valores del snapshot fresco contra los que el widget tenía en state
    // EN LOS CAMPOS QUE EL USUARIO NO ESTÁ EDITANDO.
    // Si difieren en un campo NO editado por el usuario → conflicto (otro cambió algo).
    const snapshotLocal = state.pendientes.find(r => r.ID_Linea_OV === id);
    if (snapshotLocal) {
      const conflictos = detectarConflictos(snapshotLocal, snapshotFresco, changes);
      if (conflictos.length > 0) {
        // Refrescar state local con el fresco
        syncRegistroEnState(snapshotFresco);
        btn.classList.remove('saving');
        btn.textContent = 'Reintentar';
        btn.disabled = false;
        dirtyMap.delete(id);
        showToastConflicto(conflictos);
        setTimeout(render, 300);
        return;
      }
    }

    // --- Paso 3: armar payload con snapshot previo + cambios nuevos ---
    const etaPreviaStr = formatFechaInput(snapshotFresco.ETA) || null;  // YYYY-MM-DD o null
    const estadoPrevio = normEstado(snapshotFresco.Estado);
    const comentarioPrevio = snapshotFresco.Comentario || '';

    // Los valores "nuevos": si el usuario los editó → usar lo editado.
    // Si no los editó → mantener el valor fresco del servidor (no cambia).
    const etaNuevaStr = ('ETA' in changes) ? (changes.ETA || null) : etaPreviaStr;
    const estadoNuevo = ('Estado' in changes) ? changes.Estado : estadoPrevio;
    const comentarioNuevo = ('Comentario' in changes) ? changes.Comentario : comentarioPrevio;

    const payload = {
      // Identificadores
      creator_ID: snapshotFresco.creator_ID,
      ID_Linea_OV: id,

      // Datos de contexto para el correo (desde snapshot fresco)
      Numero_OV: snapshotFresco.Numero_OV || '',
      Cliente: snapshotFresco.Cliente || '',
      Producto: snapshotFresco.Producto || '',
      Cantidad_Pendiente_Snapshot: Number(snapshotFresco.Cantidad_Pendiente_Snapshot) || 0,
      Vendedor_Responsable: snapshotFresco.Vendedor_Responsable || '',
      Fecha_OV: snapshotFresco.Fecha_OV || '',
      Ruta: snapshotFresco.Ruta || '',
      Clasificacion_ABC: snapshotFresco.Clasificacion_ABC || '',
      Monto_Pendiente: Number(snapshotFresco.Monto_Pendiente) || 0,

      // Campos a actualizar (solo los que el usuario tocó)
      // Nota: el workflow solo aplica los que estén presentes en el body.
      ...( 'Comentario' in changes ? { Comentario: changes.Comentario } : {} ),
      ...( 'ETA'        in changes ? { ETA: changes.ETA } : {} ),
      ...( 'Estado'     in changes ? { Estado: changes.Estado } : {} ),

      // Snapshot previo vs nuevo (para que el workflow de notificaciones decida)
      eta_previa: etaPreviaStr,
      eta_nueva: etaNuevaStr,
      estado_previo: estadoPrevio,
      estado_nuevo: estadoNuevo,
      comentario_previo: comentarioPrevio,
      comentario_nuevo: comentarioNuevo
    };

    if (CONFIG.DEBUG) console.log('PATCH payload:', payload);

    // --- Paso 4: hacer el PATCH ---
    const res = await fetch(CONFIG.API_BASE + CONFIG.EP_ACTUALIZAR, {
      method: 'PATCH',
      headers: { 'Content-Type': 'application/json', 'Accept': 'application/json' },
      body: JSON.stringify(payload)
    });
    const data = await res.json().catch(() => ({}));
    if (!res.ok) throw new Error('HTTP ' + res.status + ' ' + (data.message || ''));

    // --- Paso 5: actualizar state local ---
    syncRegistroEnState({
      ...snapshotFresco,
      Comentario: comentarioNuevo,
      ETA: etaNuevaStr || '',
      Estado: estadoNuevo
    });

    dirtyMap.delete(id);
    btn.classList.remove('saving');
    btn.classList.add('saved');
    btn.textContent = '✓ Guardado';
    row.classList.remove('dirty');
    showToast('success', 'Cambio guardado correctamente');

    // Si el estado cambió a Resuelto, ocultar la fila
    if (estadoNuevo === 'Resuelto') {
      state.pendientes = state.pendientes.filter(r => normEstado(r.Estado) !== 'Resuelto');
      setTimeout(render, 600);
    } else {
      setTimeout(() => {
        btn.classList.remove('saved');
        btn.textContent = 'Guardar';
        btn.disabled = true;
      }, 1500);
    }

  } catch (err) {
    console.error('Error guardando:', err);
    btn.classList.remove('saving');
    btn.textContent = 'Reintentar';
    btn.disabled = false;
    showToast('error', 'Error al guardar: ' + err.message);
  }
}

/**
 * Compara el snapshot local vs el fresco y detecta qué cambió
 * EN LOS CAMPOS QUE EL USUARIO NO ESTÁ EDITANDO.
 * Devuelve un array de objetos { campo, valor_local, valor_fresco }.
 * Si está vacío, no hay conflicto.
 */
function detectarConflictos(local, fresco, changes) {
  const camposAComparar = ['Comentario', 'ETA', 'Estado'];
  const conflictos = [];

  for (const campo of camposAComparar) {
    // Si el usuario está editando este campo, no importa que haya cambiado en el servidor:
    // el valor del usuario gana.
    if (campo in changes) continue;

    let vLocal = local[campo] ?? '';
    let vFresco = fresco[campo] ?? '';

    if (campo === 'ETA') {
      vLocal = formatFechaInput(vLocal);
      vFresco = formatFechaInput(vFresco);
    }
    if (campo === 'Estado') {
      vLocal = normEstado(vLocal);
      vFresco = normEstado(vFresco);
    }

    if (String(vLocal) !== String(vFresco)) {
      conflictos.push({ campo, local: vLocal, fresco: vFresco });
    }
  }

  return conflictos;
}

/**
 * Sincroniza un registro en state.pendientes y state.raw con los valores frescos.
 */
function syncRegistroEnState(snapshotFresco) {
  const idx = state.pendientes.findIndex(r => r.ID_Linea_OV === snapshotFresco.ID_Linea_OV);
  if (idx >= 0) state.pendientes[idx] = { ...state.pendientes[idx], ...snapshotFresco };

  const idxRaw = state.raw.findIndex(r => r.ID_Linea_OV === snapshotFresco.ID_Linea_OV);
  if (idxRaw >= 0) state.raw[idxRaw] = { ...state.raw[idxRaw], ...snapshotFresco };
}

/**
 * Toast especial para el caso de conflicto: muestra los campos que cambiaron.
 */
function showToastConflicto(conflictos) {
  const c = document.getElementById('toastContainer');
  const t = document.createElement('div');
  t.className = 'toast warn';
  const campos = conflictos.map(x => x.campo).join(', ');
  t.innerHTML = `
    <span class="toast-icon">⚠️</span>
    <div class="toast-body">
      <strong>Conflicto detectado</strong>
      <small>Otro usuario modificó este registro (${escapeHtml(campos)}) mientras editabas. Tu cambio NO se guardó. La vista fue refrescada con los datos actuales — revisá y volvé a aplicar tu edición si sigue siendo necesaria.</small>
    </div>`;
  c.appendChild(t);
  setTimeout(() => {
    t.style.opacity = '0';
    t.style.transition = 'opacity .3s';
    setTimeout(() => t.remove(), 300);
  }, 8000); // toast más largo para que alcancen a leerlo
}

/* ============================================================
   UI HELPERS
   ============================================================ */
function toggleGroup(key) {
  if (state.expanded.has(key)) state.expanded.delete(key);
  else state.expanded.add(key);
  render();
}
function showLoading() {
  document.getElementById('statusBar').style.display = '';
  document.getElementById('statusBar').innerHTML = `<div class="spinner"></div><p>Cargando pendientes...</p>`;
  document.getElementById('productList').style.display = 'none';
  document.getElementById('kpis').innerHTML = '';
}
function hideStatus() { document.getElementById('statusBar').style.display = 'none'; }
function showError(msg) {
  document.getElementById('statusBar').style.display = '';
  document.getElementById('statusBar').className = 'status-bar error';
  document.getElementById('statusBar').innerHTML = `
    <div style="font-size:32px;">⚠️</div>
    <p><strong>${escapeHtml(msg)}</strong></p>
    <p style="margin-top:8px;">Probá refrescar. Si persiste, revisá el endpoint en n8n.</p>`;

}
function updateFooter() {
  const now = new Date();
  document.getElementById('footerInfo').textContent =
    `Actualizado ${now.toLocaleString('es-CR')} · Total registros: ${state.raw.length} · Visibles (excl. Resueltos): ${state.pendientes.length}`;
}
function showToast(type, msg) {
  const c = document.getElementById('toastContainer');
  const t = document.createElement('div');
  t.className = 'toast ' + type;
  const icon = type === 'success' ? '✓' : type === 'error' ? '✕' : 'ℹ';
  t.innerHTML = `<span class="toast-icon">${icon}</span><div class="toast-body"><span>${escapeHtml(msg)}</span></div>`;
  c.appendChild(t);
  setTimeout(() => {
    t.style.opacity = '0';
    t.style.transition = 'opacity .3s';
    setTimeout(() => t.remove(), 300);
  }, 3500);
}

/* ============================================================
   FORMATTERS
   ============================================================ */
function formatMoneda(n) {
  const v = Number(n) || 0;
  return '₡' + Math.round(v).toLocaleString('es-CR');
}
function parseFecha(s) {
  if (!s) return Infinity;
  if (typeof s === 'string') {
    if (/^\d{4}-\d{2}-\d{2}$/.test(s)) return new Date(s).getTime();
    const meses = { Jan:0,Feb:1,Mar:2,Apr:3,May:4,Jun:5,Jul:6,Aug:7,Sep:8,Oct:9,Nov:10,Dec:11 };
    const m = s.match(/^(\d{1,2})-(\w{3})-(\d{4})$/);
    if (m) return new Date(parseInt(m[3]), meses[m[2]] ?? 0, parseInt(m[1])).getTime();
  }
  return new Date(s).getTime() || Infinity;
}
function formatFechaInput(s) {
  if (!s) return '';
  if (/^\d{4}-\d{2}-\d{2}/.test(s)) return s.substring(0,10);
  const meses = { Jan:'01',Feb:'02',Mar:'03',Apr:'04',May:'05',Jun:'06',Jul:'07',Aug:'08',Sep:'09',Oct:'10',Nov:'11',Dec:'12' };
  const m = String(s).match(/^(\d{1,2})-(\w{3})-(\d{4})$/);
  if (m) return `${m[3]}-${meses[m[2]]||'01'}-${m[1].padStart(2,'0')}`;
  return '';
}
function escapeHtml(s) {
  return String(s ?? '').replace(/[&<>"']/g, c => ({
    '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'
  }[c]));
}
function escapeAttr(s) { return escapeHtml(s).replace(/"/g,'&quot;'); }
function cssEscape(s) {
  return String(s).replace(/(["\\#.:;?+*~'`!@$%^&={}|<>()\[\],\/])/g,'\\$1');
}

/* ============================================================
   INIT
   ============================================================ */
document.getElementById('searchInput').addEventListener('input', e => {
  state.filters.search = e.target.value;
  render();
});
['filterRuta','filterVendedor','filterEstado'].forEach(id => {
  document.getElementById(id).addEventListener('change', e => {
    const key = id.replace('filter','').toLowerCase();

    render();
  });
});
document.getElementById('btnClear').addEventListener('click', () => {
  state.filters = { search:'', ruta:'', vendedor:'', estado:'' };
  document.getElementById('searchInput').value = '';
  document.getElementById('filterRuta').value = '';
  document.getElementById('filterVendedor').value = '';
  document.getElementById('filterEstado').value = '';
  render();
});
document.getElementById('btnRefresh').addEventListener('click', async () => {
  const btn = document.getElementById('btnRefresh');
  btn.classList.add('loading');
  await loadPendientes();
  btn.classList.remove('loading');
});

loadPendientes();
